<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Asociados - CLUB ACERIAS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/CSS/EstilosTarjetas.css">
</head>
<body>

    <header class="header-bar">
        <h1>CLUB ACERIAS - Gestión de Asociados</h1>
        <div class="header-user">
            <span>Admin MR</span>
            <a href="PaginaPrincipal.html" class="btn-cerrar-sesion">
                <i class="fa-solid fa-right-from-bracket"></i> Volver al Panel
            </a>
        </div>
    </header>

    <main class="container">
        <!-- Formulario de Registro/Edición -->
        <div class="card-panel">
            <h2><i class="fa-solid fa-user-plus"></i> Registrar Nuevo Asociado</h2>
            <form id="formAsociado" class="form-grid" style="margin-top: 15px;">
                <div class="form-group">
                    <label>Documento de Identidad</label>
                    <input type="text" placeholder="Ej. 1049123456" required>
                </div>
                <div class="form-group">
                    <label>Nombre Completo</label>
                    <input type="text" placeholder="Nombres y Apellidos" required>
                </div>
                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="tel" placeholder="300 000 0000">
                </div>
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" placeholder="correo@ejemplo.com">
                </div>
                <div class="form-group">
                    <label>Tipo de Membresía</label>
                    <select>
                        <option>Activo</option>
                        <option>Honorario</option>
                        <option>Pensionado</option>
                    </select>
                </div>
                <div class="form-group" style="grid-column: 1 / -1;">
                    <button type="submit" class="btn-primary" style="width: max-content;">Guardar Asociado</button>
                </div>
            </form>
        </div>

        <!-- Listado de Asociados -->
        <div class="card-panel">
            <h2><i class="fa-solid fa-users"></i> Listado de Asociados</h2>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Documento</th>
                        <th>Nombre</th>
                        <th>Teléfono</th>
                        <th>Membresía</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1049888777</td>
                        <td>Carlos Mendoza</td>
                        <td>311 234 5678</td>
                        <td>Activo</td>
                        <td><span class="badge badge-success">Activo</span></td>
                        <td><button class="btn-primary" style="padding: 4px 8px; font-size: 0.8rem;">Editar</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
<script src ="../Controlador/Asociados.js"></script>
</html>
