<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <style>
      .navbar-custom { background-color: #1c2841; }
    </style>
  </head>
  <body class="bg-white">
    <header class="navbar-custom text-white py-3 px-4 mb-4">
      <div class="container-fluid d-flex justify-content-between align-items-center">
        <h1 class="h4 mb-0 fw-semibold">Mi perfil</h1>
        <a href="PaginaPrincipal.html" class="btn btn-outline-light btn-sm px-3">
          <i class="bi bi-arrow-left me-1"></i> Volver al panel
        </a>
      </div>
    </header>

    <main class="container" style="max-width: 640px;">
      <p class="text-muted">Consulta y actualiza tu información personal.</p>

      <div id="mensaje" class="d-none" role="alert"></div>

      <div class="card shadow-sm">
        <div class="card-body p-4">
          <form id="formPerfil">
            <div class="mb-3">
              <label for="documento" class="form-label">Documento</label>
              <input type="text" class="form-control" id="documento" readonly />
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="nombres" class="form-label">Nombres</label>
                <input type="text" class="form-control" id="nombres" maxlength="100" required />
              </div>
              <div class="col-md-6 mb-3">
                <label for="apellidos" class="form-label">Apellidos</label>
                <input type="text" class="form-control" id="apellidos" maxlength="100" required />
              </div>
            </div>
            <div class="mb-4">
              <label for="email" class="form-label">Correo electrónico</label>
              <input type="email" class="form-control" id="email" maxlength="100" required />
            </div>
            <button type="submit" class="btn btn-success px-4">
              <i class="bi bi-check-lg me-1"></i> Guardar cambios
            </button>
          </form>
        </div>
      </div>
    </main>

    <script src="../Controlador/MiPerfil.js"></script>
  </body>
</html>
