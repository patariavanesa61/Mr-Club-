<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Actividades del club</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <style>
      .navbar-custom { background-color: #1c2841; }
      .resumen-icono {
        width: 46px; height: 46px; border-radius: 12px;
        display: flex; align-items: center; justify-content: center; font-size: 1.3rem;
      }
      .dato-etiqueta { font-size: 0.72rem; color: #6c757d; text-transform: uppercase; letter-spacing: 0.04em; }
      .btn-icono { padding: 0.25rem 0.5rem; font-size: 0.85rem; }
    </style>
  </head>
  <body class="bg-light">
    <header class="navbar-custom text-white py-3 px-4 mb-4">
      <div class="container-fluid d-flex justify-content-between align-items-center">
        <h1 class="h4 mb-0 fw-semibold">Actividades del club</h1>
        <a href="PaginaPrincipal.html" class="btn btn-outline-light btn-sm px-3">
          <i class="bi bi-arrow-left me-1"></i> Volver al panel
        </a>
      </div>
    </header>

    <main class="container pb-5" style="max-width: 1100px;">
      <!-- Resumen -->
      <div class="row g-3 mb-4">
        <div class="col-6 col-lg-3">
          <div class="card shadow-sm border-0 h-100">
            <div class="card-body d-flex align-items-center gap-3">
              <div class="resumen-icono bg-primary-subtle text-primary"><i class="bi bi-calendar-event"></i></div>
              <div>
                <div class="dato-etiqueta">Actividades</div>
                <div class="h5 mb-0" id="resTotal">-</div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="card shadow-sm border-0 h-100">
            <div class="card-body d-flex align-items-center gap-3">
              <div class="resumen-icono bg-success-subtle text-success"><i class="bi bi-calendar-check"></i></div>
              <div>
                <div class="dato-etiqueta">Próximas</div>
                <div class="h5 mb-0" id="resProximas">-</div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="card shadow-sm border-0 h-100">
            <div class="card-body d-flex align-items-center gap-3">
              <div class="resumen-icono bg-warning-subtle text-warning-emphasis"><i class="bi bi-cash-coin"></i></div>
              <div>
                <div class="dato-etiqueta">Total recaudado</div>
                <div class="h5 mb-0" id="resRecaudado">-</div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="card shadow-sm border-0 h-100">
            <div class="card-body d-flex align-items-center gap-3">
              <div class="resumen-icono bg-info-subtle text-info-emphasis"><i class="bi bi-people"></i></div>
              <div>
                <div class="dato-etiqueta" id="resEtiquetaInscripciones">Inscripciones</div>
                <div class="h5 mb-0" id="resInscripciones">-</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Barra de herramientas -->
      <div class="row g-2 align-items-center mb-3">
        <div class="col-md-5">
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
            <input type="search" id="buscador" class="form-control" placeholder="Buscar por actividad o municipio" />
          </div>
        </div>
        <div class="col-md-3">
          <select id="filtroEstado" class="form-select" aria-label="Filtrar por estado">
            <option value="todas">Todas</option>
            <option value="proximas">Próximas</option>
            <option value="finalizadas">Finalizadas</option>
          </select>
        </div>
        <div class="col-md-4 text-md-end">
          <button id="nuevaActividad" class="btn btn-success d-none" type="button">
            <i class="bi bi-plus-lg me-1"></i> Nueva actividad
          </button>
        </div>
      </div>

      <!-- Tabla -->
      <div class="card shadow-sm border-0 overflow-hidden">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th scope="col" class="py-3 px-3">Actividad</th>
                <th scope="col" class="py-3 px-3">Fecha</th>
                <th scope="col" class="py-3 px-3">Municipio</th>
                <th scope="col" class="py-3 px-3">Estado</th>
                <th scope="col" class="py-3 px-3 text-center">Inscritos</th>
                <th scope="col" class="py-3 px-3 text-end">Recaudado</th>
                <th scope="col" class="py-3 px-3 text-center">Acciones</th>
              </tr>
            </thead>
            <tbody id="listaActividades"></tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- Notificaciones -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div id="toastNotificacion" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body" id="mensajeToast"></div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
        </div>
      </div>
    </div>

    <!-- Modal: crear / editar actividad -->
    <div class="modal fade" id="modalActividad" tabindex="-1" aria-labelledby="tituloModalActividad" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <form id="formActividad">
            <div class="modal-header">
              <h2 class="modal-title fs-5" id="tituloModalActividad">Nueva actividad</h2>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="idActividad" />

              <div class="mb-3">
                <label for="nombreActividad" class="form-label">Nombre de la actividad</label>
                <input type="text" class="form-control" id="nombreActividad" maxlength="100" required />
              </div>
              <div class="mb-3">
                <label for="fechaEvento" class="form-label">Fecha</label>
                <input type="date" class="form-control" id="fechaEvento" required />
              </div>
              <div class="mb-3">
                <label for="municipio" class="form-label">Municipio</label>
                <input type="text" class="form-control" id="municipio" maxlength="50" required />
              </div>
              <div class="mb-3">
                <label for="totalRecaudado" class="form-label">Total recaudado (opcional; completar al finalizar)</label>
                <input type="number" class="form-control" id="totalRecaudado" min="0" step="0.01" placeholder="Ej.: 1500000.00" />
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-primary" id="btnGuardar">Guardar</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Modal: participantes (administrador) -->
    <div class="modal fade" id="modalParticipantes" tabindex="-1" aria-labelledby="tituloParticipantes" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <div>
              <h2 class="modal-title fs-5" id="tituloParticipantes">Participantes</h2>
              <div class="small text-muted" id="subtituloParticipantes"></div>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <div class="input-group mb-3">
              <select id="selectAsociadoInscribir" class="form-select" aria-label="Asociado a inscribir"></select>
              <button type="button" class="btn btn-success" id="btnInscribir">
                <i class="bi bi-person-plus me-1"></i> Agregar
              </button>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-2">
              <span class="dato-etiqueta">Inscritos</span>
              <span class="badge text-bg-secondary" id="contadorParticipantes">0</span>
            </div>
            <ul class="list-group" id="listaParticipantes"></ul>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Controlador/Actividades.js?v=2"></script>
  </body>
</html>
