<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Actividades del club</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <style>
      body {
        background-color: #f6f8fb;
      }
      .navbar-custom {
        background-color: #1c2841;
      }
      .tabla-club thead th {
        background-color: #1c2841;
        color: #ffffff;
        font-weight: 600;
        border: none;
      }
      .btn-action {
        padding: 0.25rem 0.5rem;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <!--Barra superior-->
    <header class="navbar-custom text-white py-3 px-4 mb-4 shadow-sm">
      <div class="container-fluid d-flex justify-content-between align-items-center" style="max-width: 960px;">
        <h1 class="h4 mb-0 fw-semibold">Actividades del club</h1>
        <a href="PaginaPrincipal.html" class="btn btn-outline-light btn-sm px-3">
          <i class="bi bi-arrow-left me-1"></i> Volver al panel
        </a>
      </div>
    </header>

    <!--Contenido principal centrado-->
    <main class="container pb-5" style="max-width: 960px;">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3 mt-3">
        <div>
          <p class="mb-0 text-muted">
            Consulta las actividades programadas y su información.
          </p>
        </div>
        <button
          id="nuevaActividad"
          class="btn btn-success btn-sm px-3 py-2 fw-medium shadow-sm"
          type="button"
          data-bs-toggle="modal"
          data-bs-target="#modalActividad"
        >
          <i class="bi bi-plus-lg me-1"></i> Nueva actividad
        </button>
      </div>

      <!-- TABLA -->
      <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0 tabla-club">
            <thead>
              <tr>
                <th scope="col" class="py-3 px-3">Actividad</th>
                <th scope="col" class="py-3 px-3">Fecha</th>
                <th scope="col" class="py-3 px-3">Municipio</th>
                <th scope="col" class="py-3 px-3 text-end">Total recaudado</th>
                <th id="encabezadoAcciones" scope="col" class="py-3 px-3 text-center">
                  Acciones
                </th>
              </tr>
            </thead>
            <tbody id="listaActividades" class="bg-white">
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- CONTENEDOR DE TOASTS -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div
        id="toastNotificacion"
        class="toast align-items-center border-0"
        role="alert"
        aria-live="assertive"
        aria-atomic="true"
      >
        <div class="d-flex">
          <div class="toast-body" id="mensajeToast"></div>
          <button
            type="button"
            class="btn-close me-2 m-auto"
            data-bs-dismiss="toast"
            aria-label="Cerrar"
          ></button>
        </div>
      </div>
    </div>

    <!--MODAL ACTIVIDAD-->
    <div
      class="modal fade"
      id="modalActividad"
      tabindex="-1"
      aria-labelledby="tituloModalActividad"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <form id="formActividad">
            <div class="modal-header bg-light">
              <h2 class="modal-title fs-5 fw-semibold" id="tituloModalActividad">
                Nueva actividad
              </h2>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Cerrar"
              ></button>
            </div>
            <div class="modal-body p-4">
              <input type="hidden" id="idActividad" />

              <div class="mb-3">
                <label for="nombreActividad" class="form-label fw-medium">
                  Nombre de la actividad
                </label>
                <input
                  type="text"
                  class="form-control"
                  id="nombreActividad"
                  maxlength="100"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="fechaEvento" class="form-label fw-medium">Fecha</label>
                <input
                  type="date"
                  class="form-control"
                  id="fechaEvento"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="municipio" class="form-label fw-medium">Municipio</label>
                <input
                  type="text"
                  class="form-control"
                  id="municipio"
                  maxlength="50"
                  required
                />
              </div>

              <div id="campoTotalRecaudado" class="mb-1">
                <label for="totalRecaudado" class="form-label fw-medium">
                  Total recaudado (opcional; completar al finalizar)
                </label>
                <input
                  type="number"
                  class="form-control"
                  id="totalRecaudado"
                  min="0"
                  step="0.01"
                  placeholder="Ej.: 1500000.00"
                />
              </div>
            </div>
            <div class="modal-footer bg-light">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancelar
              </button>
              <button type="submit" class="btn btn-primary px-4" id="btnGuardar">
                Guardar
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Controlador/Actividades.js"></script>
  </body>
</html>
