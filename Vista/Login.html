<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
         <title>CLUB ADSO</title>
         <link rel="stylesheet" href="../assets/CSS/EstiloLogin.css">
    </head>

    <body>
        <div class="Container-Login">
            <h2>Iniciar Sesión Accerías</h2>

            <form id="FormuLogin" action="../Modelo/IniciarSesion.php" method="POST">
                <div class="grupo-input">
                    <label for="Email">Correo Electrónico: </label>
                    <input type="email" id="Email" name="email" required placeholder="Ingresa Tu Correo Electrónico">
                </div>

                <div class="grupo-input">
                    <label for="Password">Contraseña: </label>
                    <input type="password" id="Password" name="Contraseña" required placeholder="Ingresa Tu Contraseña">
                </div>
                <div class="grupo-botones">
                    <button type="submit">Ingresar</button>
                    <button type="reset" class="btn-secundario">cancelar</button>
                </div>
                <p class="texto-link">
                    ¿No tienes una cuenta? <a href="Registro.html">Regístrate aquí</a>
                </p>
                <p id="mensajelogin" class="text-danger mt-3 mb-0" role="alert"></p>
            </form>
        </div>
    </body>
    <script src="../Controlador/Login.js"></script>
</html>
