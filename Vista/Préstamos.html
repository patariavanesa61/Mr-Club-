<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Préstamos - CLUB ACERIAS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/CSS/EstilosTarjetas.css">
    <style>
        .badge { display: inline-block; padding: 4px 10px; border-radius: 12px; color: #fff; font-size: 0.85rem; font-weight: 600; }
        .badge-activo { background: #1a73e8; }
        .badge-pagado { background: #198754; }
        .sin-datos { text-align: center; color: #6c757d; padding: 20px; }
    </style>
</head>
<body>

    <header class="header-bar">
        <h1>CLUB ACERIAS - Gestión de Préstamos</h1>
        <div class="header-user">
            <span>Admin MR</span>
            <a href="PaginaPrincipal.html" class="btn-cerrar-sesion">
                <i class="fa-solid fa-right-from-bracket"></i> Volver al Panel
            </a>
        </div>
    </header>

    <main class="container">
        <!-- Solicitar Préstamo -->
        <div class="card-panel">
            <h2><i class="fa-solid fa-hand-holding-dollar"></i> Registrar Préstamo</h2>
            <form id="formPrestamo" class="form-grid" style="margin-top: 15px;">
                <div class="form-group">
                    <label for="selectAsociado">Asociado</label>
                    <select id="selectAsociado" required>
                        <option value="">Seleccione un asociado...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="montoPrestamo">Monto Solicitado ($)</label>
                    <input type="number" id="montoPrestamo" min="1" placeholder="Ej. 500000" required>
                </div>
                <div class="form-group">
                    <label for="plazoMeses">Plazo (Meses)</label>
                    <input type="number" id="plazoMeses" min="1" max="48" placeholder="Ej. 12" required>
                </div>
                <div class="form-group">
                    <label for="tasaInteres">Tasa de Interés (%)</label>
                    <input type="number" id="tasaInteres" step="0.01" min="0" value="1.5" required>
                </div>
                <div class="form-group" style="grid-column: 1 / -1;">
                    <button type="submit" class="btn-primary" style="width: max-content;">Aprobar Préstamo</button>
                </div>
            </form>
        </div>

        <!-- Historial / Seguimiento de Pagos -->
        <div class="card-panel">
            <h2><i class="fa-solid fa-file-invoice-dollar"></i> Seguimiento de Préstamos</h2>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Asociado</th>
                        <th>Monto Original</th>
                        <th>Saldo Pendiente</th>
                        <th>Cuotas</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="listaPrestamos"></tbody>
            </table>
        </div>
    </main>

    <script src="../Controlador/Prestamos.js"></script>
</body>
</html>
