<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reportes y Consultas - CLUB ACERIAS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/CSS/EstilosTarjetas.css">
</head>
<body>

    <header class="header-bar">
        <h1>CLUB ACERIAS - Reportes y Consultas</h1>
        <div class="header-user">
            <span>Admin MR</span>
            <a href="PaginaPrincipal.html" class="btn-cerrar-sesion">
                <i class="fa-solid fa-right-from-bracket"></i> Volver al Panel
            </a>
        </div>
    </header>

    <main class="container">
        <!-- Panel de Reportes Rápidos -->
        <div class="card-panel">
            <h2><i class="fa-solid fa-chart-pie"></i> Generación de Reportes</h2>
            <div class="form-grid" style="margin-top: 15px;">
                <div class="form-group">
                    <label>Tipo de Reporte</label>
                    <select id="selectReporte">
                        <option value="saldos">Saldos de Préstamos Pendientes</option>
                        <option value="participacion">Estadísticas de Participación</option>
                        <option value="asociados">Directorio de Asociados Activos</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Fecha Inicio</label>
                    <input type="date">
                </div>
                <div class="form-group">
                    <label>Fecha Fin</label>
                    <input type="date">
                </div>
                <div class="form-group" style="align-self: flex-end;">
                    <button type="button" class="btn-primary"><i class="fa-solid fa-file-pdf"></i> Generar Reporte</button>
                </div>
            </div>
        </div>

        <!-- Resultados / Consultas -->
        <div class="card-panel">
            <h2><i class="fa-solid fa-table"></i> Resumen de Consultas</h2>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Concepto</th>
                        <th>Total Registros</th>
                        <th>Monto Total ($)</th>
                        <th>Estado General</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Préstamos Activos</td>
                        <td>15 Préstamos</td>
                        <td>$ 18.500.000</td>
                        <td><span class="badge badge-success">Al día</span></td>
                    </tr>
                    <tr>
                        <td>Asistencia a Eventos (Último Mes)</td>
                        <td>8 Eventos</td>
                        <td>N/A</td>
                        <td><span class="badge badge-success">85% Participación</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
<script src="../Controlador/Reportes.js"></script>
</html>
