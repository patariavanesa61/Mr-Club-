<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis pagos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <style>
      .navbar-custom { background-color: #1c2841; }
    </style>
  </head>
  <body class="bg-white">
    <header class="navbar-custom text-white py-3 px-4 mb-4">
      <div class="container-fluid d-flex justify-content-between align-items-center">
        <h1 class="h4 mb-0 fw-semibold">Mis pagos</h1>
        <a href="PaginaPrincipal.html" class="btn btn-outline-light btn-sm px-3">
          <i class="bi bi-arrow-left me-1"></i> Volver al panel
        </a>
      </div>
    </header>

    <main class="container" style="max-width: 960px;">
      <p class="text-muted">Consulta los abonos de tu préstamo.</p>

      <div id="mensaje" class="d-none" role="alert"></div>

      <!-- Resumen -->
      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <div class="card shadow-sm h-100">
            <div class="card-body">
              <div class="small text-muted">Total prestado</div>
              <div class="h4 mb-0" id="totalPrestado">-</div>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card shadow-sm h-100">
            <div class="card-body">
              <div class="small text-muted">Total abonado</div>
              <div class="h4 mb-0 text-success" id="totalAbonado">-</div>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card shadow-sm h-100">
            <div class="card-body">
              <div class="small text-muted">Saldo pendiente</div>
              <div class="h4 mb-0 text-danger" id="saldoPendiente">-</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Tabla -->
      <div class="card shadow-sm overflow-hidden">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th scope="col" class="py-3 px-3">N.º pago</th>
                <th scope="col" class="py-3 px-3">Préstamo</th>
                <th scope="col" class="py-3 px-3">Fecha</th>
                <th scope="col" class="py-3 px-3 text-end">Valor</th>
              </tr>
            </thead>
            <tbody id="listaPagos"></tbody>
          </table>
        </div>
      </div>
    </main>

    <script src="../Controlador/MisPagos.js"></script>
  </body>
</html>
